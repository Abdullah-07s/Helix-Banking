<div class="grid-2">
    <div class="stack">
        <div class="card">
            <h3 style="margin-bottom:1.5rem;">Profile Information</h3>
            <form id="profile-form">
                <div class="field">
                    <label for="profile-fullname">Full Name</label>
                    <input type="text" id="profile-fullname" required>
                </div>
                <div class="field">
                    <label for="profile-email">Email Address</label>
                    <input type="email" id="profile-email" disabled style="opacity:0.6;">
                </div>
                <div class="field">
                    <label for="profile-phone">Phone Number</label>
                    <input type="tel" id="profile-phone" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>

    <div class="stack">
        <div class="card">
            <h3 style="margin-bottom:1.5rem;">Change Password</h3>
            <form id="password-form">
                <div class="field">
                    <label for="current-password">Current Password</label>
                    <input type="password" id="current-password" required>
                </div>
                <div class="field">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required minlength="8">
                </div>
                <div class="field">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Update Password</button>
            </form>
        </div>
    </div>
</div>
