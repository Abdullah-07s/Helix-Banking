<div class="auth-card">
    <div class="auth-form-side">
        <div class="auth-brand"><span class="logo-icon">◆</span> Helix</div>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Join Helix and start banking securely</p>

        <div id="register-error" class="auth-error hidden"></div>

        <form id="register-form">
            <div class="field">
                <label for="reg-fullname">Full Name</label>
                <input type="text" id="reg-fullname" required autocomplete="name">
            </div>
            <div class="field">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="reg-phone">Phone Number</label>
                <input type="tel" id="reg-phone" required autocomplete="tel">
            </div>
            <div class="field">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required autocomplete="new-password" minlength="8">
            </div>
            <div class="field">
                <label for="reg-confirm">Confirm Password</label>
                <input type="password" id="reg-confirm" required autocomplete="new-password" minlength="8">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="#" id="go-to-login">Login</a></p>
    </div>
    <div class="auth-visual-side">
        <div class="visual-icon">🏦</div>
        <h2>Bank-level Security</h2>
        <p>Fast payments, 24/7 support, and peace of mind.</p>
    </div>
</div>
