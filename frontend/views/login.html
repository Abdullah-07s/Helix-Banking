<div class="auth-card">
    <div class="auth-form-side">
        <div class="auth-brand"><span class="logo-icon">◆</span> Helix</div>
        <h1>Welcome back!</h1>
        <p class="auth-subtitle">Login to your account</p>

        <div id="login-error" class="auth-error hidden"></div>

        <form id="login-form">
            <div class="field">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="#" id="go-to-register">Register</a></p>
    </div>
    <div class="auth-visual-side">
        <div class="visual-icon">🔒</div>
        <h2>Secure. Simple. Smart.</h2>
        <p>Helix makes banking easier and safer for you.</p>
    </div>
</div>
