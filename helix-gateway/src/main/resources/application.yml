# Declarative route table: each entry matches a path prefix and forwards
# the request to the corresponding backend service's host:port. The
# frontend (Phase 8) only ever calls this gateway on port 8080 - it
# never needs to know about ports 8081-8084 directly.

server:
  port: 8080

spring:
  application:
    name: helix-gateway

  cloud:
    gateway:
      # Allows requests from the frontend dev server (Vite/plain-JS on
      # a different port) during local development.
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
          - id: account-service
            uri: https://helix-account-service.internal.ashydesert-43d28197.uaenorth.azurecontainerapps.io
            predicates:
              - Path=/api/auth/**,/api/accounts/**,/api/profile/**
          - id: transaction-service
            uri: https://helix-transaction-service.internal.ashydesert-43d28197.uaenorth.azurecontainerapps.io
            predicates:
              - Path=/api/transactions/**
          - id: card-service
            uri: https://helix-card-service.internal.ashydesert-43d28197.uaenorth.azurecontainerapps.io
            predicates:
              - Path=/api/cards/**
          - id: fraud-service
            uri: https://helix-fraud-service.internal.ashydesert-43d28197.uaenorth.azurecontainerapps.io
            predicates:
              - Path=/api/alerts/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
